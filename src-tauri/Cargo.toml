[workspace]
members = ["agent-core"]

[package]
name = "mota-editor"
version = "0.1.0"
edition = "2021"
description = "Lightweight multi-project AI agent workbench."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { path = "agent-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "sync", "time"] }
# The user's terminal needs a real pty (ConPTY on Windows, openpty
# elsewhere) — see docs/adr/0009. Nothing else in the app spawns one.
portable-pty = "0.9"

[dev-dependencies]
# Test-only: billing_log walks a real directory tree, so its tests build one.
tempfile = "3"

[lib]
name = "mota_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
