[workspace]
members = ["agent-core"]

[package]
name = "mota-editor"
version = "0.1.0"
edition = "2021"
description = "Lightweight multi-project AI agent workbench."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { path = "agent-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "sync", "time"] }
# The user's terminal needs a real pty (ConPTY on Windows, openpty
# elsewhere) — see docs/adr/0009. Nothing else in the app spawns one.
portable-pty = "0.9"

# macOS draws its own dock badge — a red pill, whatever the state is —
# so the app-level indicator has to take the dock tile over and paint it
# itself. That means AppKit, which means these bindings. Both crates are
# already in the lock file (tao pulls them), and neither is compiled on
# any other platform. See docs/adr/0010-app-badge.md.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSBitmapImageRep",
  "NSDockTile",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSImageView",
  "NSResponder",
  "NSView",
] }

[dev-dependencies]
# Test-only: billing_log walks a real directory tree, so its tests build one.
tempfile = "3"

[lib]
name = "mota_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
